<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    try { if (localStorage.getItem('nv-invert') === '1') document.documentElement.dataset.invert = ''; } catch (e) {}
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0,700;100,300;100,500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ content }}
  {% include footer.html %}
  {% include keys.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer onerror="document.documentElement.classList.remove('motion')"></script>
</body>
</html>
